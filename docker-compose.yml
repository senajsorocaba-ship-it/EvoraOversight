# ÉVORA OVERSIGHT — os dois componentes Python rodando em Docker.
#
# Nenhum dos dois é um serviço de longa duração — são jobs de execução única,
# do mesmo jeito que já rodam hoje via linha de comando (e do mesmo jeito que
# rodariam depois num cron do servidor, num Cloud Run Job ou num CronJob do
# Kubernetes — a decisão de "onde agendar" continua pendente, isto aqui só
# empacota o "o que rodar"). Por isso os `profiles:` abaixo impedem que
# `docker compose up` suba algo por engano — use sempre `docker compose run`.
#
# Uso:
#   cp .env.example .env            # preencha as chaves reais, nunca commite o .env
#   docker compose build
#   docker compose run --rm motor
#   docker compose run --rm motor-execucao --tenant-id <uuid> --mundo gabinete

services:
  # Pipeline original, baseado em arquivo: imprensa -> PNCP -> montador (Bia) -> render HTML.
  # O volume abaixo é o mesmo comportamento de hoje sem Docker: os artefatos gerados
  # (noticias.json, contratos_sorocaba.json, briefing_AAAAMMDD.md/.html, avisos_evora.log)
  # ficam em ./motor no host, não somem quando o container termina.
  motor:
    build: .
    working_dir: /app/motor
    entrypoint: ["python", "orquestrador_evora.py"]
    volumes:
      - ./motor:/app/motor
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
    profiles: ["motor"]

  # Motor de execução do BLOCO 4: chama evora_gerar_briefing_diario no Supabase,
  # manda os blocos pra Claude redigir, grava markdown/html de volta na mesma linha.
  # Não escreve nada em disco — por isso não tem volume. tenant-id/mundo são
  # obrigatórios (mesma regra de falha fechada do script) e podem vir do .env
  # ou serem passados direto no `docker compose run`.
  motor-execucao:
    build: .
    working_dir: /app/ao-SUPABASE-BLOCO1
    entrypoint: ["python", "evora_motor_execucao.py"]
    command: ["--tenant-id", "${TENANT_ID}", "--mundo", "${MUNDO:-gabinete}"]
    environment:
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - ANTHROPIC_MODEL_BRIEFING=${ANTHROPIC_MODEL_BRIEFING:-claude-opus-5}
    profiles: ["execucao"]
