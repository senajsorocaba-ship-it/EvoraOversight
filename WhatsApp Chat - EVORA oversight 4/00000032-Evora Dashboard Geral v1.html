<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1"><title>Évora</title>
<style>
:root{--navy:#000F40;--navy2:#0a1b4a;--gold:#B5985A;--gold-light:#E4CE97;--rose:#7a2f5a;--rose-light:#e8b4d0;
--paper:#F7F5EF;--card:#FBFAF6;--ink:#23272E;--muted:#5B6470;--line:#E6E0D2;
--at-bg:#FBF1DE;--at-ink:#8A5A12;--ok-bg:#E7F0E9;--ok-ink:#1E5233}
*{box-sizing:border-box;margin:0;padding:0}html,body{height:100%}
body{background:var(--navy);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased}
.serif{font-family:Georgia,"Times New Roman",serif}
/* LOCK */
#lock{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;padding:16px;overflow:hidden;background:var(--navy);transition:opacity .55s ease}
#lock .biglogo{height:min(40vh,320px);max-width:88vw;object-fit:contain;opacity:0;animation:shieldIn 1.9s cubic-bezier(.18,.7,.3,1) .3s forwards,breathe 5s ease-in-out 2.4s infinite}
#lock .hint{margin-top:24px;text-align:center;color:#9fb2cc;font-size:13px;opacity:0;animation:lfade 1.2s ease 1.5s forwards}#lock .hint .k{color:var(--gold-light)}
#lock .sensor{position:absolute;top:20px;right:20px;display:flex;align-items:center;gap:8px;font-size:11px;color:#7b8ea8;border:1px solid rgba(181,152,90,.3);border-radius:20px;padding:6px 12px;cursor:pointer}
#lock .sensor.on .dot{background:#5fae7e;box-shadow:0 0 8px rgba(95,174,126,.8)}#lock .sensor .dot{width:8px;height:8px;border-radius:50%;background:#4a6785;transition:.3s}
.facescan{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;background:rgba(0,15,64,.72)}.facescan.show{display:flex}
.ring{width:110px;height:110px;border-radius:50%;border:3px solid rgba(181,152,90,.25);border-top-color:var(--gold);animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.facescan .txt{margin-top:16px;font-size:13px;color:#cfe0f2}
@keyframes shieldIn{0%{opacity:0;transform:translateY(-40px) scale(.5) rotate(-12deg)}55%{opacity:1;transform:translateY(6px) scale(1.05) rotate(3deg)}78%{transform:translateY(0) scale(.98)}100%{opacity:1;transform:translateY(0) scale(1) rotate(0)}}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.03)}}@keyframes lfade{to{opacity:1}}
@media(max-height:520px){#lock .biglogo{height:52vh}}
/* APP */
.app{display:flex;min-height:100vh}
.rail{width:222px;flex:none;background:var(--navy);border-right:1px solid rgba(181,152,90,.28);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;z-index:30}
.railtop{padding:14px 12px 10px;border-bottom:1px solid rgba(181,152,90,.2);cursor:pointer;text-align:center}
.railtop img{height:46px;max-width:100%;object-fit:contain}
/* SELETOR DE MUNDO */
.worldsel{display:flex;gap:5px;padding:10px 10px 4px}
.wbtn{flex:1;text-align:center;font-size:11px;font-weight:800;letter-spacing:.03em;padding:9px 6px;border-radius:9px;cursor:pointer;border:1px solid transparent;transition:.14s;color:#9fb2cc;background:rgba(255,255,255,.04)}
.wbtn .wt{display:block;font-size:8px;font-weight:700;opacity:.7;margin-top:2px}
.wbtn.gab.on{background:rgba(181,152,90,.18);border-color:var(--gold);color:#fff}
.wbtn.camp.on{background:rgba(232,180,208,.14);border-color:var(--rose-light);color:#fff}
.railwrap{padding:6px 10px;flex:1}
.railgroup{font-size:9px;letter-spacing:.15em;text-transform:uppercase;color:var(--gold-light);font-weight:800;opacity:.85;padding:12px 8px 5px}
.app.mcamp .railgroup{color:var(--rose-light)}
.tab{position:relative;display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.03);border:1px solid rgba(181,152,90,.2);border-radius:10px;padding:9px 11px;margin-bottom:6px;cursor:pointer;transition:transform .13s,border-color .13s,background .13s}
.tab:hover{transform:translateX(3px);border-color:var(--gold);background:rgba(255,255,255,.07)}
.tab.active{background:rgba(181,152,90,.16);border-color:var(--gold)}
.app.mcamp .tab:hover{border-color:var(--rose-light)}.app.mcamp .tab.active{background:rgba(232,180,208,.14);border-color:var(--rose-light)}
.tab.active::before{content:"";position:absolute;left:-10px;top:50%;transform:translateY(-50%);width:4px;height:20px;border-radius:3px;background:var(--gold)}
.app.mcamp .tab.active::before{background:var(--rose-light)}
.tab .ic{width:19px;text-align:center;font-size:15px;color:var(--gold-light);transition:transform .13s}
.app.mcamp .tab .ic{color:var(--rose-light)}
.tab:hover .ic{transform:scale(1.3)}
.tab .t{font-size:12.5px;color:#e7eef7;font-weight:600}
.tab .fixmark{margin-left:4px;font-size:9px;color:var(--gold-light);opacity:.7}
.tab .selo{position:absolute;top:-5px;right:-5px;min-width:17px;height:17px;border-radius:9px;background:var(--gold);color:#20130a;font-size:9.5px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 5px}
.railfoot{padding:10px 14px;border-top:1px solid rgba(181,152,90,.18);font-size:9.5px;color:var(--muted)}
.main{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--paper)}
.top{display:flex;align-items:center;gap:11px;padding:11px 20px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.menub{display:none;border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 10px;cursor:pointer}
.crumb{font-size:12.5px;color:var(--muted)}.crumb b{color:var(--navy)}
.wtag{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;border-radius:6px;padding:3px 9px;background:var(--at-bg);color:var(--at-ink)}
.wtag.camp{background:#f7e9f1;color:var(--rose)}
.sp{flex:1}
.search{display:flex;align-items:center;gap:7px;background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:0 12px}
.search input{background:transparent;border:none;font-size:13px;padding:9px 0;width:150px;color:var(--ink);font-family:inherit}.search input:focus{outline:none}
.bell{position:relative;border:1px solid var(--line);background:#fff;border-radius:50%;width:40px;height:40px;font-size:17px;cursor:pointer}.bell:hover{background:var(--navy);color:#fff;border-color:var(--navy)}
.bell .cnt{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;border-radius:9px;background:#c0392b;color:#fff;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 4px}
.iconbtn{border:1px solid var(--line);background:#fff;border-radius:50%;width:40px;height:40px;font-size:15px;cursor:pointer}.iconbtn:hover{background:var(--navy);color:#fff}
.ia{display:flex;align-items:center;gap:7px;border:1px solid #cfe3d6;background:#eef7f1;border-radius:20px;padding:7px 13px;cursor:pointer}
.ia .pt{width:8px;height:8px;border-radius:50%;background:#2f6b46;animation:pulse 1.9s infinite}.ia .lb{font-size:12px;font-weight:700;color:#2f6b46}.ia.listen{background:#f7e9e9}.ia.listen .lb{color:#8a2f2f}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(47,107,70,.4)}70%{box-shadow:0 0 0 7px rgba(47,107,70,0)}100%{box-shadow:0 0 0 0 rgba(47,107,70,0)}}
.mood{display:flex;align-items:center;gap:2px;padding-left:6px;border-left:1px solid var(--line)}
.face{display:flex;flex-direction:column;align-items:center;cursor:pointer;padding:2px 3px;border-radius:8px;transition:transform .13s}.face:hover{transform:scale(1.2)}
.face .em{font-size:16px;line-height:1}.face .nm{font-size:7px;color:var(--muted);max-width:38px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.face.att .em{animation:blink 1.6s infinite}@keyframes blink{0%,100%{opacity:1}50%{opacity:.4}}
.work{padding:22px;max-width:880px;width:100%;margin:0 auto;flex:1}
.eyebrow{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);font-weight:800}
.app.mcamp .eyebrow{color:var(--rose)}
.work h1{font-family:Georgia,serif;font-size:26px;color:var(--navy);margin:5px 0 2px}
.work .dt{font-size:12.5px;color:var(--muted)}
.card{margin-top:17px;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.ch{display:flex;align-items:center;gap:10px;padding:12px 16px;background:#fff;border-bottom:1px solid var(--line)}
.ch .ci{width:28px;height:28px;border-radius:8px;background:var(--navy);color:var(--gold-light);display:flex;align-items:center;justify-content:center;font-size:14px}
.app.mcamp .ch .ci{background:var(--rose)}
.ch .ct{font-family:Georgia,serif;font-size:16px;color:var(--navy)}.ch .cag{margin-left:auto;font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.cbody{padding:4px 16px 14px}
.r{display:flex;gap:11px;align-items:flex-start;padding:12px 0;border-bottom:1px dashed #ece6d8;cursor:pointer}.r:last-child{border-bottom:none}
.r .rmark{width:8px;height:8px;border-radius:50%;margin-top:6px;flex:none}.r.at .rmark{background:#d89a2a}.r.ok .rmark{background:#2f6b46}
.r .rt{font-size:14.5px;font-weight:700;color:#1a1f27;display:flex;align-items:center;gap:8px;flex-wrap:wrap}.r .rx{font-size:13px;color:#3f4651;margin-top:3px}
.fl{font-size:9px;font-weight:800;border-radius:5px;padding:2px 7px}.fl.at{background:var(--at-bg);color:var(--at-ink)}.fl.ok{background:var(--ok-bg);color:var(--ok-ink)}
.chev{margin-left:auto;color:var(--gold);font-size:17px;align-self:center}
.src{font-size:11px;color:var(--muted);margin-top:12px;padding-top:10px;border-top:1px solid var(--line)}
.alerts{position:fixed;top:60px;right:16px;width:340px;max-width:92vw;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 24px 70px rgba(0,10,40,.35);z-index:60;display:none;overflow:hidden}.alerts.show{display:block}
.ah{padding:13px 16px;background:var(--navy);color:#fff;font-family:Georgia,serif;font-size:15px;display:flex;align-items:center;gap:8px}.ah .cnt{margin-left:auto;font-size:11px;background:#c0392b;border-radius:9px;padding:2px 8px;font-family:system-ui}
.al{display:flex;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);cursor:pointer}.al:hover{background:var(--paper)}
.al .dot{width:9px;height:9px;border-radius:50%;margin-top:5px;flex:none}.al.cr .dot{background:#c0392b}.al.at .dot{background:#d89a2a}.al.in .dot{background:#2f6b46}
.al .t{font-size:13px;font-weight:600;color:#1a1f27}.al .o{font-size:11px;color:var(--muted);margin-top:2px}
.afoot{padding:10px 16px;font-size:11px;color:var(--muted);text-align:center}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;border:1px solid var(--gold);border-radius:10px;padding:10px 18px;font-size:13px;opacity:0;transition:.25s;pointer-events:none;z-index:90}.toast.show{opacity:1}
.pop{position:fixed;z-index:70;background:var(--card);border:2px solid var(--gold);border-radius:13px;padding:12px;width:250px;box-shadow:0 20px 60px rgba(0,0,0,.35);display:none}.pop.show{display:block}.pop h4{font-family:Georgia,serif;color:var(--navy);font-size:13px;margin-bottom:8px}
.opts{display:flex;flex-wrap:wrap;gap:6px}.opts button{background:#fff;border:1.5px solid var(--line);border-radius:9px;padding:6px;font-size:17px;cursor:pointer}.opts button:hover{border-color:var(--gold);transform:scale(1.1)}.opts button.sel{border-color:var(--gold);background:var(--at-bg)}
@media(max-width:860px){.rail{position:fixed;left:-230px;transition:left .2s}.rail.open{left:0}.menub{display:inline-flex}.search input{width:90px}.mood{display:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
