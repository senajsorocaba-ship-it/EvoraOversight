name: Briefing diário

# Agendador do motor de execução do briefing (ao-SUPABASE-BLOCO1/evora_motor_execucao.py)
# e de 4 coletores que rodam antes dele, para o bloco 6 já chegar com dado fresco quando
# a Bia redige: evora_coletor_mencoes.py (menções por nome), evora_coletor_farus.py
# (busca geral por território, sempre nao_verificado), evora_coletor_pncp_farus.py e
# evora_conector_agenda_legislativa.py (Manual v11.0 — dado estruturado de fonte
# primária, estado='confirmado', mas só rodam de verdade quando um território tiver
# uma farus_fontes 'configurada' pra especie deles — decisão D6, nunca automática; até
# lá, os dois últimos passos pulam cada tenant e terminam sem gravar nada, de propósito).
# Todos com --todos: processa todo tenant com ativo=true, mundo=gabinete (o único
# mundo com dado real hoje; o FARUS não tem conceito de mundo, é por território).
# Falha de um tenant não impede os demais — ver processar_tenant/--todos em cada script.
#
# Requer 3 secrets do repositório (Settings > Secrets and variables > Actions),
# as mesmas chaves já usadas em ao-SUPABASE-BLOCO1/.env localmente:
#   SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, ANTHROPIC_API_KEY

on:
  schedule:
    - cron: "30 8 * * *" # 05:30 América/São Paulo (UTC-3) — margem para terminar antes das 06:45
  workflow_dispatch: {} # permite disparo manual pela aba Actions, para teste

jobs:
  gerar-briefings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r ao-SUPABASE-BLOCO1/requirements.txt

      - run: python ao-SUPABASE-BLOCO1/evora_coletor_mencoes.py --todos --mundo gabinete
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - run: python ao-SUPABASE-BLOCO1/evora_coletor_farus.py --todos
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - run: python ao-SUPABASE-BLOCO1/evora_coletor_pncp_farus.py --todos
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - run: python ao-SUPABASE-BLOCO1/evora_conector_agenda_legislativa.py --todos
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - run: python ao-SUPABASE-BLOCO1/evora_motor_execucao.py --todos --mundo gabinete
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
